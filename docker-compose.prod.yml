# Production-oriented stack (build optimized images, Nginx edge)
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-eaw}
    volumes:
      - eaw_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-eaw}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [eaw_net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - eaw_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [eaw_net]

  qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    volumes:
      - eaw_qdrant_data:/qdrant/storage
    networks: [eaw_net]

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-eaw}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      INGESTION_MODE: async
      VECTOR_STORE_BACKEND: qdrant
      APP_ENV: production
      APP_DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - eaw_uploads:/data/uploads
    networks: [eaw_net]
    command: >
      sh -c "alembic upgrade head &&
             uvicorn eaw.main:app --host 0.0.0.0 --port 8000 --workers 2"

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-eaw}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      INGESTION_MODE: async
      VECTOR_STORE_BACKEND: qdrant
      APP_ENV: production
      LOCAL_STORAGE_PATH: /data/uploads
    depends_on:
      - redis
      - postgres
      - api
    volumes:
      - eaw_uploads:/data/uploads
    networks: [eaw_net]
    command: celery -A eaw.worker.celery_app worker --loglevel=info --concurrency=2

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - api
    networks: [eaw_net]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
      - api
    networks: [eaw_net]

networks:
  eaw_net:
    driver: bridge

volumes:
  eaw_pg_data:
  eaw_redis_data:
  eaw_qdrant_data:
  eaw_uploads:
