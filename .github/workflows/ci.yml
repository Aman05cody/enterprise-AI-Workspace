name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API lint & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      JWT_SECRET: ci-only-change-me-to-a-long-random-secret-key
      PYTHONPATH: src
      APP_ENV: test
      INGESTION_MODE: sync
      EMBEDDING_PROVIDER: hash
      VECTOR_STORE_BACKEND: memory
      LLM_PROVIDER: echo
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check src tests

      - name: Unit + smoke tests
        run: pytest tests -q --tb=short -m "not integration"

  api-integration:
    name: API integration (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eaw
          POSTGRES_PASSWORD: eaw_secret
          POSTGRES_DB: eaw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eaw -d eaw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_SECRET: ci-only-change-me-to-a-long-random-secret-key
      PYTHONPATH: src
      APP_ENV: test
      INGESTION_MODE: sync
      EMBEDDING_PROVIDER: hash
      VECTOR_STORE_BACKEND: memory
      LLM_PROVIDER: echo
      STORAGE_BACKEND: local
      DATABASE_URL: postgresql+psycopg://eaw:eaw_secret@localhost:5432/eaw_test
      TEST_DATABASE_URL: postgresql+psycopg://eaw:eaw_secret@localhost:5432/eaw_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Integration tests
        run: pytest tests/integration -q --tb=short -m integration

  web:
    name: Web typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt || true
        # Non-blocking initially; set to fail when baseline is clean

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: npm audit
        working-directory: apps/web
        run: npm audit --audit-level=high || true

  docker:
    name: Docker build smoke
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t eaw-api:ci ./apps/api

      - name: Build Web image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 \
            -t eaw-web:ci ./apps/web
