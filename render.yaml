# Render Blueprint — Enterprise AI Workspace
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy:
#   1. Push this repo to GitHub
#   2. Render Dashboard → New → Blueprint → connect repo
#   3. Apply — creates Postgres + API + Web
#
# Notes:
#   - Free web services sleep after idle (~15 min); first request is slow
#   - Free Postgres may require a paid starter plan on newer Render accounts
#   - Demo AI: hash embeddings + echo LLM (set OPENAI_API_KEY later for real answers)

# Postgres: Render no longer offers free DBs on many accounts.
# basic-256mb is the cheapest paid starter (~$6–7/mo).
# Or create free Neon (neon.tech) and paste DATABASE_URL into eaw-api manually.
databases:
  - name: eaw-db
    plan: basic-256mb
    databaseName: eaw
    user: eaw
    postgresMajorVersion: "16"

services:
  # ── API (FastAPI) ─────────────────────────────────────────────
  - type: web
    name: eaw-api
    runtime: python
    plan: free
    region: oregon
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PYTHONPATH
        value: src
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eaw-db
          property: connectionString
      - key: INGESTION_MODE
        value: sync
      - key: EMBEDDING_PROVIDER
        value: hash
      - key: VECTOR_STORE_BACKEND
        value: memory
      - key: LLM_PROVIDER
        value: echo
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_PATH
        value: /tmp/eaw-uploads
      - key: CORS_ORIGINS
        fromService:
          name: eaw-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: WEB_URL
        fromService:
          name: eaw-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: API_PUBLIC_URL
        fromService:
          name: eaw-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # ── Web (Next.js) ─────────────────────────────────────────────
  - type: web
    name: eaw-web
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: eaw-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
