# Fully FREE Render deploy (no credit card / no paid Postgres)
# - eaw-api  + eaw-web  on free plan (spin down when idle)
# - SQLite file DB on the API instance (data resets when the free service
#   restarts/redeploys — fine for demos; use free Neon later if you want persistence)
#
# Deploy: Render Dashboard → New → Blueprint → this repo → Apply

services:
  # ── API (FastAPI) ─────────────────────────────────────────────
  - type: web
    name: eaw-api
    runtime: python
    plan: free
    region: oregon
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PYTHONPATH
        value: src
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: JWT_SECRET
        generateValue: true
      # Local file DB — $0, no Render Postgres
      - key: DATABASE_URL
        value: sqlite:////tmp/eaw.db
      - key: INGESTION_MODE
        value: sync
      - key: EMBEDDING_PROVIDER
        value: hash
      - key: VECTOR_STORE_BACKEND
        value: memory
      - key: LLM_PROVIDER
        value: echo
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_PATH
        value: /tmp/eaw-uploads
      - key: CORS_ORIGINS
        fromService:
          name: eaw-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: WEB_URL
        fromService:
          name: eaw-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: API_PUBLIC_URL
        fromService:
          name: eaw-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # ── Web (Next.js) ─────────────────────────────────────────────
  - type: web
    name: eaw-web
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: eaw-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
