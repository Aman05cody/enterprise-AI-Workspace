services:
  postgres:
    image: postgres:16-alpine
    container_name: eaw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eaw_secret}
      POSTGRES_DB: ${POSTGRES_DB:-eaw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - eaw_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eaw} -d ${POSTGRES_DB:-eaw}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: eaw-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - eaw_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: eaw-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - eaw_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: eaw-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - eaw_minio_data:/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: eaw-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eaw}:${POSTGRES_PASSWORD:-eaw_secret}@postgres:5432/${POSTGRES_DB:-eaw}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT: http://minio:9000
      INGESTION_MODE: async
      VECTOR_STORE_BACKEND: qdrant
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: /data/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - eaw_uploads:/data/uploads
    command: >
      sh -c "alembic upgrade head &&
             uvicorn eaw.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: eaw-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eaw}:${POSTGRES_PASSWORD:-eaw_secret}@postgres:5432/${POSTGRES_DB:-eaw}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      INGESTION_MODE: async
      VECTOR_STORE_BACKEND: qdrant
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: /data/uploads
    volumes:
      - ./apps/api:/app
      - eaw_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A eaw.worker.celery_app worker --loglevel=info --concurrency=2

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: eaw-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  eaw_uploads:
  eaw_pg_data:
  eaw_redis_data:
  eaw_qdrant_data:
  eaw_minio_data:
